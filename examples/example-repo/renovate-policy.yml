# Policy sync note: when policy-rubric.base.md or renovate.json changes, update this file in the same PR.
# Bump version when merge authority, risk_classes, or check semantics change; packets carry policy_version for drift detection.
#
# ADOPTER: Copy to .agents/renovate-policy.yml in your repo. Customize sections marked below.
version: "3"

# risk_class enum — shared with packet-schema.md; direct lookup, no mapping layer
risk_classes:
  auto_merge_eligible:
    - lockfile_patch
    - low_risk_tooling_patch # rubric Low-risk tooling list only; patch/minor
    - github_action_pin_same_major # uses: pin, same Action major only
  agent_review_required:
    - low_risk_tooling_major # low-risk devDep major; manifest/lockfile only
  human_required:
    - high_touch_tooling
    - github_action_major
    - runtime_dependency
    - unlisted_package
    - analytics_or_telemetry
    - auth_or_security
    - sensitive_path_change
    - large_lockfile
    - renovate_config_change

merge_authority_rules:
  # Authority only — required checks come from packet required_checks (see check_assembly)
  allowed:
    risk_classes: [lockfile_patch, low_risk_tooling_patch, github_action_pin_same_major]
  # low_risk_tooling_major: npm manifest/lockfile only; workflow PRs use github_action_pin_same_major + allowed
  allowed_if_no_code_changes:
    risk_classes: [low_risk_tooling_major]
    allowed_paths:
      - "**/package.json"
      - "package-lock.json"
  denied:
    risk_classes:
      - high_touch_tooling
      - github_action_major
      - runtime_dependency
      - unlisted_package
      - analytics_or_telemetry
      - auth_or_security
      - sensitive_path_change
      - large_lockfile
      - renovate_config_change

# Investigation-approved execution mode — separate from merge_authority_rules.
# Classifier merge_authority stays denied; maintainer may derive investigation_approved_merge
# only with overlay + --approved modifier and live gate satisfaction.
execution_modes:
  investigation_approved:
    eligible_risk_classes:
      - high_touch_tooling
      - unlisted_package
    overridable_classifier_stops:
      high_touch_tooling:
        - decision_human_required
        - stop_flag_expected_human_required
        - triggered_runtime_behavior_affected_sole
      unlisted_package:
        - decision_human_required
        - stop_flag_expected_human_required
        - triggered_runtime_behavior_affected_sole
    requires_investigation_verdict: ready_for_human_merge
    requires_human_approval_modifier: --approved
    allowed_paths:
      - "**/package.json"
      - "package-lock.json"
    execute_time_gates:
      - policy_version
      - head_sha
      - merge_authority_paths

# Packet required_checks assembly — classifier adds conditional checks; executor verifies packet list only
check_assembly:
  requires_always:
    - pr_ci_green
    - post_merge_main_ci_green
  conditional:
    lockfile_within_threshold:
      include_when: package-lock.json in changed_files
    workflow_uses_pin_only:
      include_when: any .github/workflows/*.yml in changed_files
    validate_renovate_config:
      include_when: renovate.json in changed_files

checks:
  # ADOPTER: Set workflow/job names to match YOUR CI (see .github/workflows/ in your repo)
  pr_ci_green:
    when: pre_merge
    workflow: .github/workflows/ci.yml
    job: test
    description: PR head check runs must be green before merge
  post_merge_main_ci_green:
    when: post_merge
    workflow: .github/workflows/ci.yml
    job: test
    branch: main
    description: Main branch CI must be green after merge
  validate_renovate_config:
    when: pre_merge
    workflow: .github/workflows/validate-renovate-config.yml
    include_when: renovate.json in changed_files
  workflow_uses_pin_only:
    when: pre_merge
    hard_gate: true
    include_when: any .github/workflows/*.yml in changed_files
    requires:
      uses_pin_only: true
      same_major_only: true
    description: >
      Every diff hunk in .github/workflows/*.yml changes only a uses: dependency
      action version pin within the same major (e.g. actions/checkout@v6.0.0 → @v6.1.15).
      Action major bumps (v6→v7) and any other workflow edit fail this check.
  lockfile_within_threshold:
    when: pre_merge
    hard_gate: true
    include_when: package-lock.json in changed_files
    thresholds:
      line_delta_limit_default: 800
      line_delta_limit_lockfile_maintenance: 2000
      pr_file_count_single_package_max: 30
    requires_packet_fields:
      - evidence.lockfile_maintenance
      - evidence.pr_file_count
      - evidence.package_count
      - evidence.lockfile_delta.line_delta_limit
    description: >
      line_delta_total ≤ line_delta_limit (800, or 2000 when lockfile_maintenance).
      pr_file_count ≤ 30 when package_count == 1. Mirrors policy-rubric.base Lockfile impact.

repo:
  # ADOPTER: Omit owner/name to resolve from git remote, or set explicitly
  owner: example-org
  name: example-service
  # ADOPTER: Must match renovate.json branchPrefix (e.g. renovate/ for pat_branch)
  renovate_branch_prefix: renovate/
  # ADOPTER: package.json paths that define runtime scope for dependency classification
  workspace_roots:
    - package.json
    - apps/server/package.json
    - apps/web/package.json
  sensitive_paths:
    - src/server/**
    - src/frontend/**
    - renovate.json
  analytics_paths:
    - src/frontend/lib/analytics.ts
  auth_paths: []

packages:
  # ADOPTER: Frameworks and tools that always need human/investigation path
  high_touch:
    - react
    - vite
    - eslint
    - typescript
    - "@playwright/test"
  # ADOPTER: Dev-only tooling eligible for auto-merge on patch/minor (supports * globs)
  low_risk_tooling:
    - prettier
    - husky
    - lint-staged
    - "@types/*"
  # runtime: dependencies (not devDependencies) under workspace_roots, not matched above
  # unlisted: devDependency not matched above; investigation-eligible when stop_causes overridable

deployment:
  # ADOPTER: pat_branch (self-hosted + PAT) or github_app (hosted Renovate app)
  mode: pat_branch
