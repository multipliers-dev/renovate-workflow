# Representative Renovate workflow stub — customize for your deployment mode.
#
# pat_branch: self-hosted Renovate via GitHub Actions + PAT; PRs use renovate/ prefix;
#             authored by PAT owner (not app/renovate). This workflow runs Renovate on schedule.
#
# github_app: hosted Renovate / GitHub App; author is typically app/renovate.
#             You may not need this workflow — the app runs externally. Keep the file commented
#             or delete it if unused; set deployment.mode: github_app in renovate-policy.yml.

name: Renovate

on:
  schedule:
    # Adjust timezone and cadence for your team
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pat_branch only — uncomment and set repo secret RENOVATE_TOKEN; a fine-grained PAT
      # with Contents, Pull requests, Issues, Actions, and Workflows write (org repos as
      # needed) is sufficient. Classic `repo` scope is optional for the bot.
