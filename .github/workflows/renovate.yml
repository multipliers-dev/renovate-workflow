name: Renovate

on:
  schedule:
    # Sunday 13:15 UTC — Monday 00:15 AEDT (before 12pm lockFileMaintenance).
    # :15 avoids the top of the hour; GitHub scheduled runs are best-effort and
    # often slip hours late when many workflows fire at :00.
    - cron: "15 13 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
